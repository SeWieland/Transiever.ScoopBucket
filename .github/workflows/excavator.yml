name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run every 4 hours
    - cron: '20 */4 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SCOOP_BOT_TOKEN }}

      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          "SCOOP_HOME=$(Join-Path $scoopRoot 'apps\scoop\current')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create manifest update pull requests
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.SCOOP_BOT_TOKEN }}
        run: |
          git config user.name "Transiever Scoop Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .\bin\checkver.ps1 -Update -SkipUpdated

          $manifests = @(git diff --name-only -- bucket | Where-Object {
            $_ -match '^bucket/(msieve|srtx|olrx|tbrx)\.json$'
          })
          $unexpectedChanges = @(git diff --name-only | Where-Object {
            $_ -notmatch '^bucket/(msieve|srtx|olrx|tbrx)\.json$'
          })
          if ($unexpectedChanges) {
            throw "The updater changed unsupported files: $($unexpectedChanges -join ', ')"
          }

          foreach ($manifest in $manifests) {
            $app = [System.IO.Path]::GetFileNameWithoutExtension($manifest)
            $version = (Get-Content -Raw $manifest | ConvertFrom-Json).version
            $branch = "manifest/$app-$version"
            $title = "$app: Update to version $version"

            git ls-remote --exit-code --heads origin $branch *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Skipping $app: $branch already exists."
              git restore --staged --worktree $manifest
              continue
            }

            git switch -c $branch
            git add $manifest
            git commit -m $title
            git push origin $branch

            $body = @"
Automated Scoop manifest update.

Created by Transiever Scoop Excavator.
"@
            gh pr create --base main --head $branch --title $title --body $body
            git switch main
          }
