name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run every 4 hours
    - cron: '20 */4 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SCOOP_BOT_TOKEN }}

      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          "SCOOP_HOME=$(Join-Path $scoopRoot 'apps\scoop\current')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Update manifests
        shell: pwsh
        run: |
          .\bin\checkver.ps1 -Update -SkipUpdated

          $unexpectedChanges = @(git diff --name-only | Where-Object {
            $_ -notmatch '^bucket/(msieve|srtx|olrx|tbrx)\.json$'
          })
          if ($unexpectedChanges) {
            throw "The updater changed unsupported files: $($unexpectedChanges -join ', ')"
          }

      - name: Create or update manifest update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SCOOP_BOT_TOKEN }}
          branch: automation/scoop-manifest-updates
          delete-branch: true
          commit-message: 'chore: update Scoop manifests'
          committer: 'Transiever Scoop Bot <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'Transiever Scoop Bot <41898282+github-actions[bot]@users.noreply.github.com>'
          title: 'chore: update Scoop manifests'
          body: |
            Automated Scoop manifest update.

            Created by Transiever Scoop Excavator.
          add-paths: |
            bucket/*.json
