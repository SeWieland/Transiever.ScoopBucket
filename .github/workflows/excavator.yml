name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run every 4 hours
    - cron: '20 */4 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SCOOP_BOT_TOKEN }}

      - name: Install Scoop and hub
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install hub
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          (Join-Path $scoopRoot 'shims') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SCOOP_HOME=$(Join-Path $scoopRoot 'apps\scoop\current')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create manifest update pull requests
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.SCOOP_BOT_TOKEN }}
        run: |
          git config user.name "Transiever Scoop Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$env:GITHUB_REPOSITORY.git"
          .\bin\auto-pr.ps1 -Request -OriginBranch main -SkipUpdated
