name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: 'my_bucket'
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Register PowerShell Gallery
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          # Temporary Pester 5 pin; remove after Scoop's test harness supports Pester 6.
          # Tracking: https://github.com/SeWieland/Transiever.ScoopBucket/issues/4
          # Upstream: https://github.com/ScoopInstaller/Scoop/issues/6693
          modules-to-cache: BuildHelpers, Pester:5.9.0
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1

  auto-merge-manifest-update:
    name: Enable auto-merge for manifest update
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.head_ref == 'automation/scoop-manifest-updates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Verify and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          body="$(gh pr view "$PR_URL" --json body --jq .body)"
          if [[ "$body" != *"Created by Transiever Scoop Excavator."* ]]; then
            echo "Skipping $PR_URL: it was not created by the manifest updater."
            exit 0
          fi

          while IFS= read -r file; do
            case "$file" in
              bucket/msieve.json|bucket/srtx.json|bucket/olrx.json|bucket/tbrx.json) ;;
              *)
                echo "Skipping $PR_URL: it changes an unsupported file: $file"
                exit 0
                ;;
            esac
          done < <(gh pr diff "$PR_URL" --name-only)

          gh pr merge --auto --squash --subject "$PR_TITLE" "$PR_URL"
